<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App del Clima - API</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <header>
        <img src="img/banner_clima.png" alt="Banner del Clima" class="banner">
        <h1>☀️ App del Clima</h1>
        <p>Consulta el clima en tiempo real de cualquier ciudad</p>
    </header>

    <div class="botones-retos">
        <button id="btn-ubicacion" class="btn-reto">📍 Mi Ubicación</button>
        <button id="btn-tema" class="btn-reto">🌙 / ☀️ Tema</button>
    </div>

    <div id="historial" class="historial"></div>

    <main>
        <form id="formulario" class="buscador">
            <input 
                type="text" 
                id="inputCiudad" 
                placeholder="Escribe una ciudad..." 
                required
            >
            <button type="submit">
                🔍 Consultar
            </button>
        </form>

        <div id="resultado" class="resultado"></div>
        <p id="estado"></p>
    </main>

    <footer>
        <p>© 2026 - App del Clima | Datos de OpenWeatherMap</p>
        <p>Banner diseñado en Canva ☁️</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
